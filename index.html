<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#060a14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Poolean Intel" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poolean Intel</title>
    <meta name="description" content="Stats, standings, awards and highlights for a backyard pool basketball league." />
    <!-- What a group chat or social app shows for a link to the site. -->
    <meta property="og:site_name" content="Poolean Intel" />
    <meta property="og:title" content="Poolean Intel" />
    <meta property="og:description" content="Stats, standings, awards and highlights for a backyard pool basketball league." />
    <meta property="og:url" content="https://intel.poolean.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://intel.poolean.net/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply the saved theme before first paint (dark by default).
      // Blue unless a person picked something (red is saved as an empty string).
      var a = "blue"; try { var s = localStorage.getItem("pooleanIntelAccent"); if (s !== null) a = s } catch (e) {}
      if (a) document.documentElement.setAttribute("data-accent", a)
      try { if (localStorage.getItem("pooleanIntelTheme") !== "light") document.documentElement.classList.add("dark") } catch (e) { document.documentElement.classList.add("dark") }
    </script>
    <script src="/pool-league-next/poolean-external-data.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Doto:wght@700;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Shown the moment the page arrives, while the site's code loads; React replaces it. -->
    <div id="root">
      <div class="mx-auto flex max-w-5xl flex-col gap-4 p-4 sm:p-6" aria-busy="true">
        <div class="flex items-center py-3">
          <span class="font-display text-base font-extrabold uppercase sm:text-2xl sm:tracking-wide">Poolean <span class="text-accent">Intel</span></span>
        </div>
        <p class="text-sm text-muted-foreground motion-safe:animate-pulse">Loading the league</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
