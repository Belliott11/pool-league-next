<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#05090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef3f4" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Poolean Intel" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poolean Intel</title>
    <script>
      // Apply the saved theme before first paint (dark by default).
      try { var a = localStorage.getItem("pooleanIntelAccent"); if (a) document.documentElement.setAttribute("data-accent", a) } catch (e) {}
      try { if (localStorage.getItem("pooleanIntelTheme") !== "light") document.documentElement.classList.add("dark") } catch (e) { document.documentElement.classList.add("dark") }
    </script>
    <script src="/pool-league-next/poolean-external-data.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
