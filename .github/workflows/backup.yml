name: Back up league data

# Every night, saves a copy of the league data (the league_state row), Pick'em votes and preseason predictions as a file attached to
# the run, kept 30 days. Only collaborators on the repository can download it (Actions tab, the run, Artifacts). The editor's private
# labels are not included: the public key cannot read them. The run fails, and GitHub emails, if the league data comes back empty or
# much smaller than it should, so a wiped row is noticed. To restore, see "Backups" in CLAUDE.md.
on:
  schedule:
    - cron: "41 6 * * *" # 1:41 AM Eastern (2:41 in summer), before the clip cuts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the tables
        run: |
          set -euo pipefail
          url=$(jq -r .url public/cloud-config.json)
          key=$(jq -r .anonKey public/cloud-config.json)
          mkdir -p backup
          get() { curl -sS --fail --retry 3 -H "apikey: $key" -H "Authorization: Bearer $key" "$url/rest/v1/$1" -o "backup/$2.json"; }
          get "league_state?select=*" league_state
          get "pickem_votes?select=*" pickem_votes
          get "season_predictions?select=*" season_predictions
          get "rsvp_replies?select=night,player,going,updated_at" rsvp_replies
          get "prop_picks?select=game_id,pid,voter,pick,line,updated_at" prop_picks
          get "poty_votes?select=*" poty_votes
          get "season_goals?select=*" season_goals
          games=$(jq '.[0].data.games | length' backup/league_state.json)
          players=$(jq '.[0].data.players | length' backup/league_state.json)
          echo "League data: $games games, $players players, updated $(jq -r '.[0].updated_at' backup/league_state.json)"
          echo "Pick'em votes: $(jq length backup/pickem_votes.json), predictions: $(jq length backup/season_predictions.json), RSVP replies: $(jq length backup/rsvp_replies.json), prop picks: $(jq length backup/prop_picks.json), Play of the Year votes: $(jq length backup/poty_votes.json), goals: $(jq length backup/season_goals.json)"
          # A wiped or broken row should not pass quietly.
          test "$games" -ge 5 && test "$players" -ge 5
      - uses: actions/upload-artifact@v7
        with:
          name: league-backup-${{ github.run_number }}
          path: backup/
          retention-days: 30
