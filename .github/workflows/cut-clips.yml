name: Cut new clips

# Every night, cuts any clip that does not have its short file yet (new games, newly reviewed or re-trimmed clips), uploads it to the
# video bucket with a picture of the play for its share link, and commits the updated lists (src/data/clip-cuts.json and
# src/data/clip-shares.json), then deploys the site so it plays them. A night with nothing
# new changes nothing. Needs the repository secret CLOUDFLARE_API_TOKEN (an R2 token with Admin Read & Write); without it the run
# stops early and says so. Can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "23 7 * * *" # 2:23 AM Eastern (3:23 in summer), after game nights
  workflow_dispatch:

permissions:
  contents: write # commit the updated list
  actions: write # start the deploy

concurrency:
  group: cut-clips
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check for the Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to cut clips automatically." && exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run cut-clips
      - name: Commit the list and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/clip-cuts.json src/data/clip-shares.json src/data/trailer.json src/data/mixtapes.json && ! git status --porcelain src/data/trailer.json src/data/mixtapes.json | grep -q .; then
            echo "No new clips tonight."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data/clip-cuts.json src/data/clip-shares.json src/data/trailer.json src/data/mixtapes.json
          git commit -m "New clip cuts"
          # Someone may push to main while this runs (a run takes minutes), so catch up and retry rather than fail.
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push && break
            [ "$i" = 4 ] && exit 1
            sleep $((i * 5))
          done
          # A push made by this workflow does not start other workflows, so the deploy is started here.
          gh workflow run deploy.yml --ref main
