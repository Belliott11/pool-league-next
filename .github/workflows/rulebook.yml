name: Track the rulebook

# Every hour, reads Poolean's rulebook (poolean.net) and, when its text has changed, adds the new version to src/data/rulebook.json,
# dated the day it was first seen, commits it and deploys the site. Every game is matched to the rules in force on its date
# (src/lib/rulebook.ts). An hour with no change changes nothing. Can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write # commit the new version
  actions: write # start the deploy

concurrency:
  group: rulebook
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/rulebook.mjs
      - name: Commit a new version and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/rulebook.json; then
            echo "Rulebook unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data/rulebook.json
          git commit -m "Rulebook changed on poolean.net"
          # Someone may push to main while this runs (a run takes minutes), so catch up and retry rather than fail.
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push && break
            [ "$i" = 4 ] && exit 1
            sleep $((i * 5))
          done
          # A push made by this workflow does not start other workflows, so the deploy is started here.
          gh workflow run deploy.yml --ref main
